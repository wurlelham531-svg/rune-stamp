<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rune Stamp</title>
<meta name="description" content="Rune Stamp -- mint one of 24 runes on Stacks (Clarity 4)" />
<!-- TALENT-PROTOCOL-META-PLACEHOLDER -->
<style>
  :root { color-scheme: dark; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #1a0e0a; color: #e8eaed;
    max-width: 720px; margin: 0 auto; padding: 32px 20px;
    line-height: 1.5;
  }
  h1 { font-size: 28px; margin-bottom: 8px; color: #d99a4e; }
  p.tagline { color: #a68a72; margin-top: 0; }
  .card {
    background: #2c1b16; border: 1px solid #4a3225; border-radius: 8px;
    padding: 24px; margin: 24px 0;
  }
  .runes {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 16px 0;
  }
  .rune {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: #0a0e1a; border: 2px solid #4a3225; border-radius: 4px;
    cursor: pointer; font-size: 18px; user-select: none;
    transition: transform 0.1s, border-color 0.1s;
  }
  .rune:hover { transform: scale(1.05); border-color: #d99a4e; }
  .rune.selected { border-color: #d99a4e; background: #4a3225; }
  button {
    background: #985b2a; color: white; border: 0; padding: 12px 24px;
    border-radius: 6px; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #b86f33; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  .addr, .log { font-size: 12px; color: #a68a72; word-break: break-all; }
  .log { margin-top: 16px; }
  .log code { color: #e8eaed; background: #1a0e0a; padding: 2px 6px; border-radius: 3px; }
  a { color: #d99a4e; }
</style>
</head>
<body>
  <h1>Rune Stamp</h1>
  <p class="tagline">Pick one of 24 runes. Stamp it on-chain to mint a sequential ID.</p>

  <div class="card">
    <div id="runes" class="runes"></div>
    <div class="addr" id="who">not connected</div>
  </div>

  <div class="row">
    <button id="connect">Connect Wallet</button>
    <button id="stamp" disabled>Stamp Selected Rune</button>
  </div>

  <div class="log" id="log"></div>

  <p class="addr" style="margin-top:32px;">
    Contract: <a id="contractLink" target="_blank" rel="noopener"></a><br />
    Network: Stacks Mainnet &middot; Clarity 4
  </p>

<script type="module">
  import { showConnect, openContractCall } from "https://esm.sh/@stacks/connect@7.7.1";
  import { uintCV, PostConditionMode } from "https://esm.sh/@stacks/transactions@6.17.0";

  const CONTRACT_ADDRESS = "SP16F6839630K5XX06KE7KVNSNMYBK89912NH6N4C";
  const CONTRACT_NAME    = "rune-stamp";
  const APP_NAME         = "Rune Stamp";
  const RUNE_GLYPHS = ["ᚠ","ᚢ","ᚦ","ᚨ","ᚱ","ᚲ","ᚷ","ᚹ","ᚺ","ᚾ","ᛁ","ᛃ","ᛇ","ᛈ","ᛉ","ᛊ","ᛏ","ᛒ","ᛖ","ᛗ","ᛚ","ᛜ","ᛞ","ᛟ"];

  const $ = (id) => document.getElementById(id);
  $("contractLink").href = `https://explorer.hiro.so/${CONTRACT_ADDRESS}.${CONTRACT_NAME}?chain=mainnet`;
  $("contractLink").textContent = `${CONTRACT_ADDRESS}.${CONTRACT_NAME}`;

  let selectedRune = null;
  let connected = false;

  const runesEl = $("runes");
  RUNE_GLYPHS.forEach((glyph, i) => {
    const id = i + 1;
    const div = document.createElement("div");
    div.className = "rune";
    div.textContent = glyph;
    div.title = `Rune ${id}`;
    div.onclick = () => {
      selectedRune = id;
      document.querySelectorAll(".rune").forEach((r) => r.classList.remove("selected"));
      div.classList.add("selected");
      $("stamp").disabled = !connected;
    };
    runesEl.appendChild(div);
  });

  $("connect").onclick = () => {
    showConnect({
      appDetails: { name: APP_NAME, icon: window.location.origin + "/icon.png" },
      onFinish: ({ userSession }) => {
        const ud = userSession.loadUserData();
        $("who").textContent = "you: " + ud.profile.stxAddress.mainnet;
        connected = true;
        if (selectedRune) $("stamp").disabled = false;
      },
    });
  };

  $("stamp").onclick = () => {
    if (!selectedRune) return;
    openContractCall({
      contractAddress: CONTRACT_ADDRESS,
      contractName:    CONTRACT_NAME,
      functionName:    "stamp",
      functionArgs:    [uintCV(selectedRune)],
      postConditionMode: PostConditionMode.Allow,
      network: "mainnet",
      appDetails: { name: APP_NAME, icon: window.location.origin + "/icon.png" },
      onFinish: (data) => {
        $("log").innerHTML = `stamp tx: <code>${data.txId}</code> &mdash; <a href="https://explorer.hiro.so/txid/${data.txId}?chain=mainnet" target="_blank">explorer</a>`;
      },
    });
  };
</script>
</body>
</html>
